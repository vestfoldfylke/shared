# Requires setup of trusted publisher before deploying. Read more: https://docs.npmjs.com/trusted-publishers and https://docs.npmjs.com/trusted-publishers
# All npm installations are run with --ignore-scripts, if you know that something is safe, and need it to run, set up a script in package.json called "safe-post-install", and run what you need.
#
# Call from other workflows:
# jobs:
#   publish-npm-package:
#     uses: vestfoldfylke/shared/.github/workflows/publish-npm-package.yml@main
#     permissions:
#       id-token: write  # Required for OIDC (trusted publisher setup)
#       contents: read
#     with:
#       node_version: 24 # this one is optional and defaults to 24 if not set
#       audit_severity: "moderate" # this one is optional and defaults to "moderate" if not set. Can be one of (null, info, low, moderate, high, critical, none)
#

name: Publish NPM Package (Trusted publisher)
on:
  workflow_call:
    inputs:
      node_version:
        required: false
        type: number
        default: 24
      audit_severity:
        required: false
        type: string
        default: "moderate"
        
jobs:
  call-security:
    uses: vestfoldfylke/shared/.github/workflows/npm-security.yml@main
    with:
      audit_severity: ${{ inputs.audit_severity }}
      node_version: ${{ inputs.node_version }}

  build-and-deploy:
    needs: call-security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout GitHub Action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node ${{ inputs.node_version }} Environment
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node_version }}
          registry-url: 'https://registry.npmjs.org'
      
      # Ensure npm 11.5.1 or later is installed
      - name: Update npm to latest
        run: npm install -g npm@latest

      - name: Resolve All Project Dependencies Using Npm, Build and Test
        shell: bash
        run: |
          npm ci --ignore-scripts
          npm run safe-post-install --if-present
          npm run build --if-present
          npm run test --if-present

      - name: Publish to NPM
        run: npm stage publish
