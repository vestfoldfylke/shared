name: Deploy Azure Function (dotnet)
on:
  workflow_call:
    inputs:
      azure_appname:
        description: 'The name of the Azure Function App to deploy to (without slot name, e.g. "my-function-app")'
        required: true
        type: string
      azure_functionapp_package_path:
        description: 'The path to the Azure Function App project to deploy relative to the root of the repository. If multiple projects exist in the same solution, set this to the project to deploy (e.g. "src/MyFunctionApp"). Usually just "."'
        required: true
        type: string
      dotnet_version:
        description: 'The .NET version to use (e.g. "8.0.x", "9.0.x", "10.0.x") and must follow the TargetFramework version set in the project file (*.csproj)'
        required: true
        type: string
      audit_severity:
        description: 'Minimum severity to fail on (e.g. "Moderate|High|Critical", "High|Critical", "Critical")'
        required: false
        type: string
        default: "Moderate|High|Critical"
    secrets:
      azure_publishprofile:
        description: 'The publish profile for the Azure Function App. Recommended: use a secret like secrets.azure_publishprofile for your publish profile'
        required: true

jobs:
  call-security:
    uses: vestfoldfylke/shared/.github/workflows/dotnet-security.yml@main
    with:
      audit_severity: ${{ inputs.audit_severity }}
      dotnet_version: ${{ inputs.dotnet_version }}

  build-and-deploy:
    needs: call-security
    runs-on: self-hosted
    steps:
      - name: "Checkout GitHub Action"
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup .NET ${{ inputs.dotnet_version }} Environment
        uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5.3.0
        with:
          dotnet-version: ${{ inputs.dotnet_version }}

      - name: 'Test Project'
        run: dotnet test --configuration Release

      - name: 'Resolve Project Dependencies Using Dotnet'
        shell: bash
        run: |
          pushd './${{ inputs.azure_functionapp_package_path }}'
          dotnet build --configuration Release --output ./output
          popd

      - name: 'Run Azure Functions Action'
        uses: Azure/functions-action@bc63708cc6539760eea18d8a7de4ce8ef5fdf593 # v1.5.6
        id: fa
        with:
          app-name: ${{ inputs.azure_appname }}
          slot-name: 'Production'
          package: '${{ inputs.azure_functionapp_package_path }}/output'
          publish-profile: ${{ secrets.azure_publishprofile }}
