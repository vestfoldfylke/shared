name: Deploy Azure Function (dotnet)
on:
  workflow_call:
    inputs:
      azure_appname:
        description: 'The name of the Azure Function App to deploy to (without slot name, e.g. "my-function-app")'
        required: true
        type: string
      azure_functionapp_package_path:
        description: 'The path to the Azure Function App project to deploy relative to the root of the repository. If multiple projects exist in the same solution, set this to the project to deploy (e.g. "src/MyFunctionApp"). Usually just "."'
        required: true
        type: string
      dotnet_version:
        description: 'The .NET version to use (e.g. "8.0", "9.0", "10.0") and must follow the TargetFramework version set in the project file (*.csproj)'
        required: true
        type: string
      audit_severity:
        description: 'Minimum severity to fail on (e.g. "Moderate|High|Critical", "High|Critical", "Critical")'
        required: false
        type: string
        default: "Moderate|High|Critical"
      needs_node:
        description: 'Pulls in actions/setup-node if set to true'
        required: false
        default: false
        type: boolean
      node_audit_severity:
        description: 'Can be one of (null, info, low, moderate, high, critical, none)'
        required: false
        type: string
        default: "moderate"
      node_version:
        required: false
        type: number
        default: 22
      handle_ef_migrations:
        description: 'Handles EF Migrations if set to true'
        required: false
        default: false
        type: boolean
    secrets:
      azure_publishprofile:
        description: 'The publish profile for the Azure Function App. Recommended: use a secret like secrets.azure_publishprofile for your publish profile'
        required: true
      db_connection_string:
        description: 'The database connection string used by `dotnet ef database update`. Required when handle_ef_migrations is true.'
        required: false

env:
  DOTNET_VERSION: "${{ inputs.dotnet_version }}.x"
  FRAMEWORK_VERSION: "net${{ inputs.dotnet_version }}"

jobs:
  call-node-security:
    if: inputs.needs_node == true
    uses: vestfoldfylke/shared/.github/workflows/npm-security.yml@main
    with:
      audit_severity: ${{ inputs.node_audit_severity }}
      node_version: ${{ inputs.node_version }}
      package_path: ${{ inputs.azure_functionapp_package_path }}

  build-and-deploy:
    needs: call-node-security
    if: ${{ !cancelled() && !failure() }}
    runs-on: self-hosted
    steps:
      - name: Checkout GitHub Action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET ${{ env.DOTNET_VERSION }} Environment
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Node ${{ inputs.node_version }} Environment
        if: inputs.needs_node == true
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node_version }}

      - name: Restore dependencies
        shell: bash
        run: dotnet restore

      - name: Check for vulnerable NuGet packages matching severity ${{ inputs.audit_severity }}
        shell: bash
        run: |
          echo "🔍 Checking for vulnerable NuGet package dependencies..."

          vulnerable=$(dotnet list package --vulnerable --include-transitive 2>&1 | grep -iE "${{ inputs.audit_severity }}" || true)

          if [ -n "$vulnerable" ]; then
            echo "❌ Vulnerable package dependencies found:"
            echo "$vulnerable"
            exit 1
          fi

          echo "✅ No vulnerable package dependencies found."

      - name: Test Project with ${{ env.FRAMEWORK_VERSION }}
        run: dotnet test --configuration Release -f ${{ env.FRAMEWORK_VERSION }}

      - name: Publish Project with ${{ env.FRAMEWORK_VERSION }}
        shell: bash
        run: |
          pushd './${{ inputs.azure_functionapp_package_path }}'
          dotnet publish --configuration Release --output ./output -f ${{ env.FRAMEWORK_VERSION }}
          popd

      - name: Install dotnet-ef tool
        if: inputs.handle_ef_migrations == true
        shell: bash
        run: |
          dotnet tool update --global dotnet-ef --version "${{ inputs.dotnet_version }}.*" \
            || dotnet tool install --global dotnet-ef --version "${{ inputs.dotnet_version }}.*"
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Apply EF Core Migrations
        if: inputs.handle_ef_migrations == true
        shell: bash
        working-directory: ${{ inputs.azure_functionapp_package_path }}
        env:
          DB_CONNECTION_STRING: ${{ secrets.db_connection_string }}
        run: |
          if [ -z "$DB_CONNECTION_STRING" ]; then
            echo "❌ handle_ef_migrations is true but the db_connection_string secret is empty."
            exit 1
          fi

          echo "🔧 Applying EF Core migrations..."
          dotnet ef database update --connection "$DB_CONNECTION_STRING" --no-build --configuration Release -f ${{ env.FRAMEWORK_VERSION }}
          echo "✅ EF Core migrations applied."

      - name: Run Azure Functions Action
        uses: Azure/functions-action@c5060b3b8bb1ebbcb531abd00c822ecbaa8ea656 # v1.5.7
        id: fa
        with:
          app-name: ${{ inputs.azure_appname }}
          package: '${{ inputs.azure_functionapp_package_path }}/output'
          publish-profile: ${{ secrets.azure_publishprofile }}
