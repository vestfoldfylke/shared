# Call from other workflows:
#
# Single-target project:
#jobs:
#  call-security:
#    uses: vestfoldfylke/shared/.github/workflows/dotnet-security.yml@main
#    with:
#      audit_severity: "Moderate|High|Critical" # optional. Defaults to "Moderate|High|Critical". Can be one of (Moderate|High|Critical, High|Critical, Critical)
#      dotnet_version: "8.0.x" # required. setup-dotnet format
#      framework_version: "net8.0" # optional. Pins `dotnet test` to a single TFM (recommended for single-target apps)
#      package_path: "." # optional. Defaults to ".". Set when multiple projects exist in the same solution and you don't want to evaluate all projects
#
# Multi-target NuGet package (all declared TFMs are restored, audited and tested):
#jobs:
#  call-security:
#    uses: vestfoldfylke/shared/.github/workflows/dotnet-security.yml@main
#    with:
#      # audit_severity omitted → we want to use the default "Moderate|High|Critical"
#      dotnet_version: |
#        8.0.x
#        9.0.x
#      # framework_version omitted → every TFM in <TargetFrameworks> is tested
#      # package_path omitted → we want to use the default "." to check all projects
#

name: dotnet security checks
on:
  workflow_call:
    inputs:
      audit_severity:
        description: 'Minimum severity to fail on (e.g. "Moderate|High|Critical", "High|Critical", "Critical")'
        required: false
        type: string
        default: "Moderate|High|Critical"
      dotnet_version:
        description: 'The .NET version(s) to install. Single-target: "8.0.x". Multi-target packages: pass a multi-line YAML block scalar so every declared TFM can be built and tested, e.g.:
          dotnet_version: |
            8.0.x
            9.0.x'
        required: true
        type: string
      framework_version:
        description: 'Optional TargetFramework to restrict `dotnet test` to (e.g. "net8.0"). Leave empty for multi-target projects so every TFM is tested.'
        required: false
        type: string
        default: ""
      package_path:
        description: 'Working directory for restore/audit/test (e.g. "." or "./project")'
        required: false
        type: string
        default: "."

jobs:
  dotnet-audit:
    runs-on: ubuntu-latest
    permissions: 
      contents: read
    steps:
      - name: Checkout GitHub Action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET ${{ inputs.dotnet_version }} Environment
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ inputs.dotnet_version }}

      - name: Restore dependencies
        shell: bash
        working-directory: ${{ inputs.package_path }}
        run: dotnet restore

      - name: Check for vulnerable NuGet packages matching severity ${{ inputs.audit_severity }} # NOTE: When updating this, also update ./.github/actions/nuget-publish/action.yml
        shell: bash
        working-directory: ${{ inputs.package_path }}
        run: |
          echo "🔍 Checking for vulnerable NuGet package dependencies..."

          vulnerable=$(dotnet list package --vulnerable --include-transitive 2>&1 | grep -iE "${{ inputs.audit_severity }}" || true)

          if [ -n "$vulnerable" ]; then
            echo "❌ Vulnerable package dependencies found:"
            echo "$vulnerable"
            exit 1
          fi

          echo "✅ No vulnerable package dependencies found."

      - name: Test Project # NOTE: When updating this, also update ./.github/actions/nuget-publish/action.yml
        shell: bash
        working-directory: ${{ inputs.package_path }}
        run: |
          if [ -n "${{ inputs.framework_version }}" ]; then
            dotnet test --configuration Release -f ${{ inputs.framework_version }}
          else
            dotnet test --configuration Release
          fi
