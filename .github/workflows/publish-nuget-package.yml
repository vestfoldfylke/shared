name: Publish NuGet Package (Trusted publisher)
on:
  workflow_call:
    inputs:
      dotnet_version:
        description: 'The .NET version to use (e.g. "8.0.x", "9.0.x", "10.0.x") and must follow the TargetFramework version set in the project file (*.csproj)'
        required: false
        type: string
        default: "8.0.x"
      audit_severity:
        description: 'Minimum severity to fail on (e.g. "Moderate|High|Critical", "High|Critical", "Critical")'
        required: false
        type: string
        default: "Moderate|High|Critical"
      project_path:
        description: 'The path to the .csproj file relative to the root of the repository'
        required: true
        type: string
      project_release_path:
        description: 'The path to the directory containing the .nupkg file(s) relative to the root of the repository'
        required: true
        type: string
    secrets:
      NUGET_API_KEY:
        description: 'Short-lived NuGet API key obtained from NuGet login step in the calling workflow'
        required: true

env:
    NUGET_SOURCE: https://api.nuget.org/v3/index.json

jobs:
  call-security:
    uses: vestfoldfylke/shared/.github/workflows/dotnet-security.yml@main
    with:
      audit_severity: ${{ inputs.audit_severity }}
      dotnet_version: ${{ inputs.dotnet_version }}

  build-and-deploy:
    needs: call-security
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout GitHub Action"
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      # Build/pack the project
      - name: Setup .NET ${{ inputs.dotnet_version }} Environment
        uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5.3.0
        with:
          dotnet-version: ${{ inputs.dotnet_version }}

      - name: Restore dependencies
        run: dotnet restore

      - name: Test
        run: dotnet test --configuration Release

      - name: Build and pack project # <GeneratePackageOnBuild>true</GeneratePackageOnBuild> must be added to .csproj
        run: dotnet build --configuration Release

      - name: Publish NuGet package to NuGet.org
        run: dotnet nuget push ${{ inputs.project_release_path }}/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source ${{ env.NUGET_SOURCE }}
