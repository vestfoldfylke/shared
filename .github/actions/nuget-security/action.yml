name: NuGet Security
description: Checks for vulnerable NuGet package dependencies

inputs:
  audit_severity:
    description: 'Minimum severity to fail on (e.g. "Moderate|High|Critical", "High|Critical", "Critical")'
    required: false
    default: "Moderate|High|Critical"
  dotnet_version:
    description: 'The .NET version to use (e.g. "8.0.x", "9.0.x", "10.0.x") and must follow the TargetFramework version set in the project file (*.csproj)'
    required: false
    default: "8.0.x"

runs:
  using: composite
  steps:
    - name: Checkout
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

    - name: Setup .NET
      uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5.3.0
      with:
        dotnet-version: ${{ inputs.dotnet_version }}

    - name: Restore dependencies
      shell: bash
      run: dotnet restore

    - name: Check for vulnerable NuGet packages
      shell: bash
      run: |
        echo "🔍 Checking for vulnerable NuGet package dependencies..."
        
        vulnerable=$(dotnet list package --vulnerable --include-transitive 2>&1 | grep -iE "${{ inputs.audit_severity }}" || true)
        
        if [ -n "$vulnerable" ]; then
          echo "❌ Vulnerable package dependencies found:"
          echo "$vulnerable"
          exit 1
        fi
        
        echo "✅ No vulnerable package dependencies found."