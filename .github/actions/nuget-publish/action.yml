name: NuGet Publish
description: Logs in to NuGet using OIDC Trusted Publisher, builds, packs and publishes a NuGet package

inputs:
  nuget_user:
    description: 'nuget.org username'
    required: true
  audit_severity:
    description: 'Minimum severity to fail on (e.g. "Moderate|High|Critical", "High|Critical", "Critical")'
    required: false
    default: "Moderate|High|Critical"
  dotnet_version:
    description: 'The .NET version to use (e.g. "8.0.x", "9.0.x", "10.0.x") and must follow the TargetFramework version set in the project file (*.csproj)'
    required: false
    default: "8.0.x"
  project_release_path:
    description: 'The path to the .csproj file relative to the root of the repository'
    required: true

runs:
  using: composite
  steps:
    - name: Check vulnerabilities
      uses: vestfoldfylke/shared/.github/actions/nuget-security@main
      with:
        audit_severity: ${{ inputs.audit_severity }}
        dotnet_version: ${{ inputs.dotnet_version }}

    - name: Checkout
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

    - name: Setup .NET
      uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5.3.0
      with:
        dotnet-version: ${{ inputs.dotnet_version }}

    - name: Restore dependencies
      shell: bash
      run: dotnet restore

    - name: Test
      shell: bash
      run: dotnet test --configuration Release

    - name: Build and pack
      shell: bash
      run: dotnet build --configuration Release

    - name: NuGet login
      uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
      id: login
      with:
        user: ${{ inputs.nuget_user }}

    - name: Publish NuGet package
      shell: bash
      run: dotnet nuget push ${{ inputs.project_release_path }}/*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json