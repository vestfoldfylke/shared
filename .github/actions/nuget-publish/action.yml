name: NuGet Publish
description: Logs in to NuGet using OIDC Trusted Publisher, builds, packs and publishes a NuGet package

inputs:
  nuget_user:
    description: 'nuget.org username'
    required: true
  audit_severity:
    description: 'Minimum severity to fail on (e.g. "Moderate|High|Critical", "High|Critical", "Critical")'
    required: false
    default: "Moderate|High|Critical"
  dotnet_version:
    description: 'The .NET version(s) to install. Single-target: "8.0.x". Multi-target packages: pass a multi-line YAML block scalar so every declared TFM can be built and tested, e.g.:
      dotnet_version: |
        8.0.x
        9.0.x'
    required: false
    default: "8.0.x"
  framework_version:
    description: 'Optional TargetFramework to restrict `dotnet test` to (e.g. "net8.0"). Leave empty on multi-target projects so every TFM in `<TargetFrameworks>` is tested.'
    required: false
    default: ""
  project_path:
    description: 'The path to the .csproj file relative to the root of the repository (e.g. "./project")'
    required: true
  package_path:
    description: 'Working directory for restore/audit/test (e.g. "." or "./project")'
    required: false
    default: "."

runs:
  using: composite
  steps:
    - name: Setup .NET ${{ inputs.dotnet_version }} Environment
      uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5.3.0
      with:
        dotnet-version: ${{ inputs.dotnet_version }}

    - name: Restore dependencies
      shell: bash
      working-directory: ${{ inputs.package_path }}
      run: dotnet restore

    - name: Check for vulnerable NuGet packages matching severity ${{ inputs.audit_severity }} # NOTE: When updating this, also update ./.github/workflows/dotnet-security.yml
      shell: bash
      working-directory: ${{ inputs.package_path }}
      run: |
        echo "🔍 Checking for vulnerable NuGet package dependencies..."

        vulnerable=$(dotnet list package --vulnerable --include-transitive 2>&1 | grep -iE "${{ inputs.audit_severity }}" || true)

        if [ -n "$vulnerable" ]; then
          echo "❌ Vulnerable package dependencies found:"
          echo "$vulnerable"
          exit 1
        fi

        echo "✅ No vulnerable package dependencies found."

    - name: Test Project # NOTE: When updating this, also update ./.github/workflows/dotnet-security.yml
      shell: bash
      working-directory: ${{ inputs.package_path }}
      run: |
        if [ -n "${{ inputs.framework_version }}" ]; then
          dotnet test --configuration Release -f ${{ inputs.framework_version }}
        else
          dotnet test --configuration Release
        fi

    - name: Build and Pack Project
      shell: bash
      working-directory: ${{ inputs.project_path }}
      run: dotnet build --configuration Release

    - name: NuGet login
      uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
      id: login
      with:
        user: ${{ inputs.nuget_user }}

    - name: Publish NuGet package
      shell: bash
      run: dotnet nuget push ${{ inputs.project_path }}/bin/Release/*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json
