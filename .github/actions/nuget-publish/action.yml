name: NuGet Publish
description: Logs in to NuGet using OIDC Trusted Publisher, builds, packs and publishes a NuGet package

inputs:
  nuget_user:
    description: 'nuget.org username'
    required: true
  audit_severity:
    description: 'Minimum severity to fail on (e.g. "Moderate|High|Critical", "High|Critical", "Critical")'
    required: false
    default: "Moderate|High|Critical"
  dotnet_version:
    description: 'The .NET version(s) to install. Single-target: "8.0.x". Multi-target packages: pass a multi-line YAML block scalar so every declared TFM can be built and tested, e.g.:
      dotnet_version: |
        8.0.x
        9.0.x'
    required: false
    default: "8.0.x"
  project_release_path:
    description: 'The path to the .csproj file relative to the root of the repository'
    required: true
  shared_ref:
    description: 'Ref of the shared repo to get the actions from. Defaults to "main"'
    required: false
    default: 'main'

runs:
  using: composite
  steps:
    - name: Checkout vestfoldfylke/shared
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: vestfoldfylke/shared
        ref: ${{ inputs.shared_ref }}
        path: .shared

    - name: Run .NET security checks
      uses: ./.shared/.github/actions/dotnet-security
      with:
        audit_severity: ${{ inputs.audit_severity }}
        dotnet_version: ${{ inputs.dotnet_version }}
        framework_version: ${{ inputs.framework_version }}
        package_path: ${{ inputs.package_path }}

    - name: Run .NET security checks
      uses: ./.github/actions/dotnet-security
      with:
        audit_severity: ${{ inputs.audit_severity }}
        dotnet_version: ${{ inputs.dotnet_version }}

    - name: Build and Pack Project
      shell: bash
      run: dotnet build --configuration Release

    - name: NuGet login
      uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
      id: login
      with:
        user: ${{ inputs.nuget_user }}

    - name: Publish NuGet package
      shell: bash
      run: dotnet nuget push ${{ inputs.project_release_path }}/*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json
